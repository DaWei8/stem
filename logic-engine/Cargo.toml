[package]
name = "logic-engine"
version = "0.1.0"
edition = "2021"
description = "Core simulation engine for STEM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
evalexpr = "8.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
